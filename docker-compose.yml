services:
  spark-master:
    image: spark:3.5.0-java17-scala
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8089:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./target:/opt/spark-apps
    networks:
      - spark-network

  spark-worker-1:
    image: spark:3.5.0-java17-scala
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    ports:
      - "8091:8081"
    networks:
      - spark-network

  spark-worker-2:
    image: spark:3.5.0-java17-scala
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    ports:
      - "8092:8081"
    networks:
      - spark-network

  spark-worker-3:
    image: spark:3.5.0-java17-scala
    container_name: spark-worker-3
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    ports:
      - "8093:8081"
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
